version: '3.8'

services:
  ollama:
    image: ollama/ollama:0.1.48
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    command: serve

  open-webui:
    image: ghcr.io/open-webui/open-webui:git-99b4d4f
    container_name: open-webui
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - open-webui_data:/app/backend/data
    restart: unless-stopped
    depends_on:
      - ollama

volumes:
  ollama_data:
  open-webui_data:
